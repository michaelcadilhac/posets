name: CI
on: [push]
jobs:
  test:
    # Match the last passing toolchain; ubuntu-latest now selects Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get -y install zsh git gcc python-is-python3 ninja-build gnupg wget python3-pip python3-setuptools pkg-config libglib2.0-dev libffi-dev autoconf automake libtool bison flex valgrind
        sudo pip install --upgrade meson
    - name: Checkout repository and submodules
      uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Install pinned lint tools
      run: python3 -m pip install -r .github/requirements-lint.txt
    - name: Test that everything is tidy
      run: |
        clang-tidy tests/downset-bm.cc -- -Iinclude -Ilib --std=c++20 || exit 1
        .github/run-clang-format.py --clang-format-executable clang-format -r include || exit 1
    - name: Setup configuration
      run: |
        CXXFLAGS="-DDIMENSION=100" meson setup build --buildtype debug
    - name: Compile everything
      run: |
        cd build && meson compile
    - name: Run all tests at native hardware widths
      run: |
        for mode in compatible native max; do
          build/tests/downset-matrix-$mode --metadata
        done
        meson test -C build --no-rebuild --num-processes 1 --timeout-multiplier 2 --print-errorlogs
    - name: Build portable instrumentation tests
      run: |
        CXXFLAGS="-DDIMENSION=100 -march=x86-64 -mtune=generic" meson setup build-valgrind --buildtype debug -Dtest_native_isa=false
        meson compile -C build-valgrind
    - name: Run portable Valgrind coverage
      run: |
        for mode in compatible native max; do
          build-valgrind/tests/downset-matrix-$mode --metadata
        done
        # Trace children so the Python replay checks' C++ processes are covered.
        # Normal suites cover packaging; those checks compile new programs and
        # would otherwise run the compiler itself under Memcheck.
        meson test -C build-valgrind --no-rebuild --num-processes 1 --no-suite packaging --timeout-multiplier 10 --print-errorlogs --wrap='valgrind --trace-children=yes --error-exitcode=18 --exit-on-first-error=yes'

  baseline:
    name: Linux x86-64 baseline (no ISA flags)
    runs-on: ubuntu-24.04
    env:
      TMPDIR: ${{ github.workspace }}/build-tmp
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Install packages
      run: |
        mkdir -p "$TMPDIR"
        sudo apt-get update
        sudo apt-get -y install g++ meson ninja-build
    - name: Build baseline without target flags
      run: |
        CXX=g++ CXXFLAGS="-DDIMENSION=100" meson setup build-baseline --buildtype debug -Dtest_native_isa=false
        meson compile -C build-baseline -j1
    - name: Report baseline widths and run the full suite
      run: |
        for mode in compatible native max; do
          build-baseline/tests/downset-matrix-$mode --metadata
        done
        meson test -C build-baseline --no-rebuild --num-processes 1 --timeout-multiplier 2 --print-errorlogs

  macos-arm64:
    name: macOS arm64 (GCC 15)
    runs-on: macos-15
    env:
      TMPDIR: ${{ github.workspace }}/build-tmp
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Install GCC and build tools
      run: |
        mkdir -p "$TMPDIR"
        test "$(uname -m)" = arm64
        brew install gcc@15 meson ninja
        echo "CXX=$(brew --prefix gcc@15)/bin/g++-15" >> "$GITHUB_ENV"
    - name: Build with libstdc++ and default test options
      run: |
        "$CXX" --version
        CXXFLAGS="-DDIMENSION=100" meson setup build --buildtype debug
        meson compile -C build -j1
    - name: Report arm64 widths and run the full suite
      run: |
        for mode in compatible native max; do
          build/tests/downset-matrix-$mode --metadata
        done
        meson test -C build --no-rebuild --num-processes 1 --timeout-multiplier 2 --print-errorlogs
